name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same branch to save runner minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ #
  # Job 0: validate the workflow files themselves
  # ------------------------------------------------------------------ #
  validate-workflows:
    name: Validate Workflows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Catches invalid `secrets`/`if:` expressions and other syntax problems
      # that otherwise make GitHub reject a workflow before it can run.
      # No path argument: actionlint discovers .github/workflows itself.
      - name: Lint GitHub Actions workflow files
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  # ------------------------------------------------------------------ #
  # Job 1: lint + unit tests on every push and pull request
  # ------------------------------------------------------------------ #
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. Lint the source
        run: npm run lint

      - name: 5. Verify node_modules integrity
        run: npm audit --audit-level=high --omit=dev || echo "audit warnings are non-blocking"

      - name: 6. Run unit tests with coverage
        run: npm run test:ci

      - name: 7. Upload coverage report to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ------------------------------------------------------------------ #
  # Job 2: build the image and prove it works, without pushing it
  # ------------------------------------------------------------------ #
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Verify the tests also pass inside a clean container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.test
          push: false
          load: true
          tags: devops-module5-api:test
          cache-from: type=gha

      - name: 4. Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: devops-module5-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 5. Start container
        run: docker run -d --name module5-ci -p 3000:3000 devops-module5-api:ci

      - name: 6. Wait for the API to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then
              echo ""
              echo "API is healthy"
              exit 0
            fi
            echo "waiting... attempt $i"
            sleep 2
          done
          echo "API did not become healthy in time"
          docker logs module5-ci
          exit 1

      - name: 7. Smoke test the endpoints
        run: |
          curl -fsS http://localhost:3000/       | tee /dev/stderr | grep -q "REST API is running"
          curl -fsS http://localhost:3000/api/items | grep -q '"count"'
          curl -fsS http://localhost:3000/metrics  | grep -q "api_http_requests_total"

      - name: 8. Show container logs
        if: always()
        run: docker logs module5-ci

      - name: 9. Clean up
        if: always()
        run: docker rm -f module5-ci || true
