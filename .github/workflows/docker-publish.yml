name: Build and Push Image

# This workflow runs on every push to main.
# It runs the tests, builds the image and pushes it to Docker Hub.
# Use the CD workflow (cd.yml) for tagged production releases.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ #
  # Guard: the publish step needs secrets that only exist after the
  # repository owner has configured them (see SUBMISSION.md, Step 4).
  # Without this the workflow would fail on every push.
  # ------------------------------------------------------------------ #
  check-secrets:
    name: Check Docker Hub Credentials
    runs-on: ubuntu-latest
    outputs:
      can-push: ${{ steps.check.outputs.can-push }}
    steps:
      - name: Detect Docker Hub secrets
        id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "can-push=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials found for $DOCKERHUB_USERNAME"
          else
            echo "can-push=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Docker Hub not configured::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets are missing, so the image push is skipped. See SUBMISSION.md Step 4."
          fi

  build-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    needs: check-secrets
    if: needs.check-secrets.outputs.can-push == 'true'

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js and run tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci

      - name: 3. Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 4. Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/devops-module5-api
          tags: |
            type=raw,value=latest
            type=branch,branch=main
            type=sha,format=short

      - name: 5. Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: 6. Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 7. Summary
        run: |
          {
            echo "### Docker image published"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
