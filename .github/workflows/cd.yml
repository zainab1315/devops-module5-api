name: CD - Build, Push and Deploy

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build and deploy (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

# Never deploy two versions at the same time
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: devops-module5-api

jobs:
  # ------------------------------------------------------------------ #
  # Job 1: run the tests before anything is published
  # ------------------------------------------------------------------ #
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci

  # ------------------------------------------------------------------ #
  # Job 2: build the image, push to Docker Hub and create a GitHub release
  # ------------------------------------------------------------------ #
  build-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Resolve the version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: 3. Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 4. Extract Docker metadata (labels + tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=sha,format=short

      - name: 5. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 6. Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 7. Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: 8. Save the image digest as an output
        id: digest
        run: echo "digest=$(docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }} --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ #
  # Job 3: deploy to Render via the Render Deploy Hook
  # ------------------------------------------------------------------ #
  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-push
    environment:
      name: production
      url: https://devops-module5-api.onrender.com
    # The secrets context is not available in a step-level `if:`, so the hook
    # is exposed as a job-level env var and the steps gate on `env` instead.
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

    steps:
      - name: 1. Trigger the Render deploy hook
        if: env.RENDER_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK"

      - name: 2. Wait and verify the live health endpoint
        if: env.RENDER_DEPLOY_HOOK != ''
        run: |
          for i in $(seq 1 30); do
            echo "Checking https://devops-module5-api.onrender.com/health (attempt $i)"
            if curl -fsS https://devops-module5-api.onrender.com/health; then
              echo ""
              echo "Deployment verified live"
              exit 0
            fi
            sleep 10
          done
          echo "Deployment could not be verified in time"
          exit 1

      - name: 3. Skip - no Render hook configured
        if: env.RENDER_DEPLOY_HOOK == ''
        run: echo "RENDER_DEPLOY_HOOK secret not set - skipping the Render deploy step"

  # ------------------------------------------------------------------ #
  # Job 4: publish a GitHub release for the tag
  # ------------------------------------------------------------------ #
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-push
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Container image
            `${{ secrets.DOCKERHUB_USERNAME }}/devops-module5-api:${{ github.ref_name }}`

            ## Endpoints
            - Health check: `/health`
            - Prometheus metrics: `/metrics`
            - API root: `/`
